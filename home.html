<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <!-- daisyui+tailwind  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font-awesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *{
            font-family: "Geist", sans-serif;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar bg-base-100 shadow-sm flex flex-col md:flex-row justify-between gap-2 ">
            <div class=" ">
                <div class="flex items-center">
                     <img src="./assets/github-logo.png" alt="" class="block max-w-9">
                 <a class="btn btn-ghost text-xl">GitHub Issues Tracker</a>
                </div>
               
            </div>
            <div class="flex flex-col md:flex-row gap-2">
               
                <label class="input">
                 <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <g
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    stroke-width="2.5"
                    fill="none"
                    stroke="currentColor"
                     >
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </g>
                 </svg>
                 <input id="inputSearch" type="search" required placeholder="Search" />
                </label>
                <button id="btnSearch" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Issue</button>
            
         </div>
      
         </div>
         </div>
        </div>
    </header>
    <section class="w-[80%]  mx-auto mt-10 bg-white shadow-md" >
        <div class="p-6">
            <button id="allBtn" onclick="loadAllIssue()" class="btn btn-primary">All</button>
            <button id="openBtn" onclick="loadOpenIssue()" class="btn btn-outline text-gray-400">Open</button>
            <button id="closeBtn" onclick="loadCloseIssue()" class="btn btn-outline text-gray-400">Closed</button>
        </div>
    </section>
    <section class="w-[80%]  mx-auto mt-2 bg-white shadow-md p-6" >
        <div class="flex justify-between items-center">
            <div class="flex gap-1 items-center">
                <div>
                    <img src="./assets/Aperture.png" alt="">
                </div>
                 <div>
                    <p id="counter" class="font-semibold text-[#1F2937]">0 Issues</p>
                    <p class="text-[#64748B]">Track and manage your project issues</p>
                 </div>
            </div>
            <div class="flex gap-1 flex-col md:flex-row">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                    <span>Open</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                    <span>Closed</span>
                </div>
            </div>
        </div>
        
    </section>
    <section id='spinner' class="w-[80%]  mx-auto mt-2 bg-white shadow-md p-4  flex justify-center items-center hidden">
        <span class="loading loading-spinner loading-md"></span>
    </section>
    <section id="Container" class="w-[80%]  mx-auto mt-2 bg-white shadow-md p-4 ">
        <div id="allIssue" class="grid grid-cols-1 md:grid-cols-4 gap-3 ">
            
        </div>
    </section>
    <!-- Open the modal using ID.showModal() method -->
    <!-- <button class="btn" onclick="my_modal_5.showModal()">open modal</button> -->
    <dialog id="my_modal" class="modal modal-bottom sm:modal-middle">
    
    <div class="modal-box">
    <div id="detailContainer" class="bg-white shadow-md p-6 space-y-6">
       
    </div>
    
    <div class="modal-action">
      <form method="dialog">
        <!-- if there is a button in form, it will close the modal -->
        <button class="btn btn-primary">Close</button>
      </form> 
    </div>
     </div>
    </dialog>
   
    <script src="./scripts/home.js"></script>
</body>
</html>
